name: IP DB

# maxmind-geoip2 갱신(화·금 05:00 UTC) 다음 날에 만든다.
# 결과는 data 브랜치에 커밋 하나로 덮어쓴다 (매번 1MB씩 기록이 쌓이지 않게)
on:
    schedule:
        - cron: "0 6 * * 3,6"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup Bun
                uses: oven-sh/setup-bun@v2

            -   name: Install Dependencies
                run: bun ci

            -   name: Build
                run: bun scripts/build-ipdb.ts out

            -   name: Publish to data branch
                working-directory: out
                run: |
                    git init -q -b data
                    git add .
                    git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "IP DB $(cat version)"
                    git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
