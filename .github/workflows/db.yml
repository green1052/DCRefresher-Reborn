name: DB

on:
    schedule:
        - cron: "0 6 * * 3,6"
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: db
    cancel-in-progress: false

jobs:
    db:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@v7
                with:
                    ref: release
                    persist-credentials: false

            -   uses: oven-sh/setup-bun@v2

            -   name: Install Dependencies
                run: bun ci

            -   name: Keep hand-managed files
                id: keep
                run: |
                    git fetch -q --depth=1 origin data
                    mkdir -p db
                    git show FETCH_HEAD:ban.json > db/ban.json
                    git show FETCH_HEAD:_headers > db/_headers
                    echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"

            -   name: Build
                run: bun scripts/build-db.ts

            -   name: Publish to data branch
                working-directory: db
                env:
                    GH_TOKEN: ${{ github.token }}
                    LEASE: ${{ steps.keep.outputs.sha }}
                run: |
                    git init -q -b data
                    git add .
                    git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "IP DB $(cat version)"
                    git push --force-with-lease="data:$LEASE" "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" data
