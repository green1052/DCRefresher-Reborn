name: DB

on:
    schedule:
        - cron: "0 6 * * 3,6"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup Bun
                uses: oven-sh/setup-bun@v2

            -   name: Install Dependencies
                run: bun ci

            -   name: Build
                run: bun scripts/build-ipdb.ts

            -   name: Keep ban.json
                run: |
                    if git fetch -q --depth=1 origin data; then
                        git show FETCH_HEAD:ban.json > db/ban.json 2>/dev/null || rm -f db/ban.json
                    fi

            -   name: Publish to data branch
                working-directory: db
                run: |
                    git init -q -b data
                    git add .
                    git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "IP DB $(cat version)"
                    git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
