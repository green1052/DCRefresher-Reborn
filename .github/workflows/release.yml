name: Release

on:
    push:
        tags:
            - "*.*.*"

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7

            # 태그와 package.json 버전이 다르면 스토어에 엉뚱한 버전이 올라간다
            -   name: Check version
                run: |
                    version=$(jq -r .version package.json)
                    if [ "$version" != "$GITHUB_REF_NAME" ]; then
                        echo "::error::태그 $GITHUB_REF_NAME 와 package.json 버전 $version 이 다릅니다."
                        exit 1
                    fi

            -   uses: oven-sh/setup-bun@v2

            -   name: Install Dependencies
                run: bun ci

            -   name: Type check
                run: bun run compile

            -   name: Build
                run: bun run zip && bun run zip:firefox

            -   name: Release
                uses: softprops/action-gh-release@v3
                with:
                    files: |
                        .output/*-firefox.zip
                        .output/*-chrome.zip
                    generate_release_notes: true

            -   name: Submit to stores
                run: >-
                    bun wxt submit
                    --chrome-zip .output/*-chrome.zip
                    --firefox-zip .output/*-firefox.zip
                    --firefox-sources-zip .output/*-sources.zip
                env:
                    CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                    CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                    CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                    CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
                    FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
                    FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
                    FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

    # 릴리즈마다 이 태그의 코드로 DB를 새로 만든다. IP 형식을 바꾼 버전도 스토어 심사를 마치기 전에 새 형식이 올라가 있다
    # (확장은 업데이트 때 DB를 다시 받는다). 검사·빌드·제출이 실패한 릴리즈는 DB를 바꾸지 않도록 릴리즈 뒤에 돈다
    db:
        needs: release
        uses: ./.github/workflows/db.yml
