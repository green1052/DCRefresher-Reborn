name: Release

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Check version
                run: jq -e --arg tag "$GITHUB_REF_NAME" '.version == $tag' package.json > /dev/null || { echo "::error::태그 $GITHUB_REF_NAME 와 package.json 버전이 다릅니다."; exit 1; }

            -   uses: oven-sh/setup-bun@v2

            -   name: Install Dependencies
                run: bun ci

            -   name: Type check
                run: bun run compile

            -   name: Unit tests
                run: bun run test

            -   name: Build
                run: bun run zip && bun run zip:firefox

            -   name: Install browsers
                run: bunx playwright install --with-deps chromium firefox

            -   name: E2E tests (Chromium)
                run: bun run e2e

            -   name: E2E tests (Firefox)
                run: bun run e2e:firefox

            -   name: Upload E2E report
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: playwright-report
                    path: |
                        playwright-report
                        test-results
                    retention-days: 7

            -   name: Release
                uses: softprops/action-gh-release@v3
                with:
                    files: |
                        .output/*-firefox.zip
                        .output/*-chrome.zip
                    generate_release_notes: true

            -   name: Submit to stores
                continue-on-error: true
                run: >-
                    bun wxt submit
                    --chrome-zip .output/*-chrome.zip
                    --firefox-zip .output/*-firefox.zip
                    --firefox-sources-zip .output/*-sources.zip
                env:
                    CHROME_API_VERSION: v2
                    CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                    CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
                    CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
                    CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
                    FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
                    FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
                    FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

    db:
        needs: release
        permissions:
            contents: write
        uses: ./.github/workflows/db.yml
