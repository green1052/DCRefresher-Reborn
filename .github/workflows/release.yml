name: Release

on:
    push:
        # 버전 태그(6.0.2 등)에만 돈다
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

# 작업마다 필요한 권한만 준다. 쓰기는 GitHub 릴리즈(release)와 data 브랜치 푸시(db)만 한다
permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        permissions:
            contents: write
        steps:
            -   uses: actions/checkout@v7

            # 태그와 package.json 버전이 다르면 스토어에 엉뚱한 버전이 올라간다
            -   name: Check version
                run: jq -e --arg tag "$GITHUB_REF_NAME" '.version == $tag' package.json > /dev/null || { echo "::error::태그 $GITHUB_REF_NAME 와 package.json 버전이 다릅니다."; exit 1; }

            -   uses: oven-sh/setup-bun@v2

            -   name: Install Dependencies
                run: bun ci

            -   name: Type check
                run: bun run compile

            -   name: Unit tests
                run: bun run test

            -   name: Build
                run: bun run zip && bun run zip:firefox

            # E2E는 위에서 zip을 만들며 남은 .output/chrome-mv3를 크로미엄에 올린다 (tests/e2e/fixtures.ts).
            # 확장을 올려야 해서 headless shell이 아니라 크로미엄 본체가 필요하다. 실패하면 릴리즈하지 않는다
            -   name: Install Chromium
                run: bunx playwright install --with-deps chromium

            -   name: E2E tests
                run: bunx playwright test

            -   name: Upload E2E report
                if: failure()
                uses: actions/upload-artifact@v4
                with:
                    name: playwright-report
                    path: |
                        playwright-report
                        test-results
                    retention-days: 7

            -   name: Release
                uses: softprops/action-gh-release@v3
                with:
                    files: |
                        .output/*-firefox.zip
                        .output/*-chrome.zip
                    generate_release_notes: true

            # 두 스토어를 함께 제출한다. 제출 도구는 한 스토어가 실패해도 다른 스토어를 끝까지 제출하고 실패로 끝나는데,
            # 실패해도 넘어가게 해 DB는 막히지 않는다. 실패한 스토어는 로그에서 확인하고 GitHub 릴리즈의 zip으로 따로 제출한다 (docs/DEVELOPMENT.md 릴리즈).
            # Chrome 웹 스토어는 API v2(서비스 계정)로 제출한다
            -   name: Submit to stores
                continue-on-error: true
                run: >-
                    bun wxt submit
                    --chrome-zip .output/*-chrome.zip
                    --firefox-zip .output/*-firefox.zip
                    --firefox-sources-zip .output/*-sources.zip
                env:
                    CHROME_API_VERSION: v2
                    CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                    CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
                    CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
                    CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
                    FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
                    FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
                    FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

    # 릴리즈마다 이 태그의 코드로 DB를 새로 만든다. IP 형식을 바꾼 버전도 스토어 심사를 마치기 전에 새 형식이 올라가 있다
    # (확장은 업데이트 때 DB를 다시 받는다). 검사·빌드가 실패한 릴리즈는 DB를 바꾸지 않도록 릴리즈 뒤에 돈다. 스토어 제출은 실패해도 넘어가므로 DB와 상관없다
    db:
        needs: release
        permissions:
            contents: write
        uses: ./.github/workflows/db.yml
