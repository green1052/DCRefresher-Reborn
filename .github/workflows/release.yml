name: Release

on:
    push:
        branches:
            - release

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    version:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            version: ${{ steps.version.outputs.version }}
            new: ${{ steps.version.outputs.new }}
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false
                    sparse-checkout: package.json
                    sparse-checkout-cone-mode: false

            -   name: Check version
                id: version
                run: |
                    version=$(jq -r .version package.json)
                    echo "version=$version" >> "$GITHUB_OUTPUT"
                    if git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
                        echo "::notice::$version 태그가 이미 있어 릴리즈하지 않습니다."
                        echo "new=false" >> "$GITHUB_OUTPUT"
                    else
                        echo "new=true" >> "$GITHUB_OUTPUT"
                    fi

    ci:
        needs: version
        if: needs.version.outputs.new == 'true'
        uses: ./.github/workflows/ci.yml

    release:
        needs: [version, ci]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   uses: ./.github/actions/setup

            -   name: Build
                run: bun run zip && bun run zip:firefox

            -   name: Release
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: ${{ needs.version.outputs.version }}
                    target_commitish: ${{ github.sha }}
                    files: |
                        .output/*-firefox.zip
                        .output/*-chrome.zip
                    generate_release_notes: true

            -   name: Submit to stores
                continue-on-error: true
                run: >-
                    bun wxt submit
                    --chrome-zip .output/*-chrome.zip
                    --firefox-zip .output/*-firefox.zip
                    --firefox-sources-zip .output/*-sources.zip
                env:
                    CHROME_API_VERSION: v2
                    CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                    CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
                    CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
                    CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
                    FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
                    FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
                    FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
