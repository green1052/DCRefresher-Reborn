name: Live

# 실제 디시 E2E (bun run e2e:live). 디시 마크업·API와 디시 JS에서 옮긴 키(core/preview/dcinside-js.ts)가 바뀌었는지 본다.
# 해외 IP인 러너에서 디시가 다르게 응답할 수 있어 아직 손으로만 돌린다. 읽기 요청만 보낸다 (e2e/fixtures.ts가 쓰기를 끊는다).
on:
    workflow_dispatch:
        inputs:
            list_url:
                description: PC 목록 주소 (비우면 미니 갤러리 bjwg64)
                required: false
                default: ""

permissions:
    contents: read

concurrency:
    group: live
    cancel-in-progress: false

jobs:
    live:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   uses: ./.github/actions/setup

            -   name: Install browser
                timeout-minutes: 3
                run: bunx playwright install --with-deps chromium

            # e2e:live 스크립트가 먼저 빌드한다.
            -   name: Live E2E tests
                env:
                    DC_LIST_URL: ${{ inputs.list_url }}
                run: bun run e2e:live

            -   name: Upload E2E report
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: playwright-report-live
                    path: |
                        playwright-report
                        test-results
                    retention-days: 7
