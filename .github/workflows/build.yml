name: Release
on:
  push:
    tags:
      - "*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm build
          cd build/firefox-mv2-prod zip -1 -r ../mv2.zip .
          cd build/chrome-mv3-prod && zip -1 -r ../mv3.zip .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mv2.zip
            mv3.zip
          generate_release_notes: true

      - name: Release AMO
        uses: browser-actions/release-firefox-addon@latest
        with:
          addon-id: dcrefresher-reborn@green1052
          addon-path: mv2.zip
          auth-api-issuer: ${{ secrets.AUTH_API_ISSUER }}
          auth-api-secret: ${{ secrets.AUTH_API_SECRET }}
          release-note: https://github.com/green1052/DCRefresher-Reborn/releases/tag/${{ github.ref_name }}

      - name: Release CWS
        uses: browser-actions/release-chrome-extension@latest
        with:
          extension-id: pmfifcbendahnkeojgpfppklgioemgon
          extension-path: mv3.zip
          oauth-client-id: ${{ secrets.OAUTH_CLIENT_ID }}
          oauth-client-secret: ${{ secrets.OAUTH_CLIENT_SECRET }}
          oauth-refresh-token: ${{ secrets.OAUTH_REFRESH_TOKEN }}
