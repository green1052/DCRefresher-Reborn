name: Check

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup Bun
                uses: oven-sh/setup-bun@v2

            -   name: Install Dependencies
                run: bun install --frozen-lockfile

            -   name: Typecheck
                run: bun run check

            -   name: Build
                run: bun run build
