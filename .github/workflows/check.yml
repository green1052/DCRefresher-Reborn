name: Check

# develop 푸시는 검사하지 않는다. 릴리즈 워크플로가 올리기 전에 타입 검사를 한다
on:
    pull_request:
        paths-ignore:
            - "**.md"
            - "docs/**"
    workflow_dispatch:

concurrency:
    group: check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7

            -   uses: ./.github/actions/setup

            -   name: Type check
                run: bun run compile

            -   name: Build
                run: bun run build && bun run build:firefox
