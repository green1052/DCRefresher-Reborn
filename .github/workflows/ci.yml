name: CI

on:
    pull_request:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   uses: ./.github/actions/setup

            -   name: Type check
                run: bun run compile

            -   name: Unit tests
                run: bun run test

            -   name: Build with bundle analysis
                run: bunx wxt build --analyze

            -   name: Upload bundle analysis
                uses: actions/upload-artifact@v7
                with:
                    name: bundle-stats
                    path: stats.html
                    retention-days: 7

            # content.js는 디시 모든 페이지에서 document_start에 파싱된다. 의도한 증가라면 같은 커밋에서 상한을 올린다.
            -   name: Bundle size
                env:
                    CONTENT_JS_LIMIT: 565000
                run: |
                    cd .output/chrome-mv3
                    {
                        echo "| 파일 | 바이트 |"
                        echo "| --- | ---: |"
                        for f in content-scripts/* background.js chunks/*.js; do
                            echo "| $f | $(stat -c %s "$f") |"
                        done
                        echo
                        echo "content.js 상한: $CONTENT_JS_LIMIT 바이트"
                    } >> "$GITHUB_STEP_SUMMARY"
                    size=$(stat -c %s content-scripts/content.js)
                    if [ "$size" -gt "$CONTENT_JS_LIMIT" ]; then
                        echo "::error::content.js가 $size 바이트로 상한 $CONTENT_JS_LIMIT 바이트를 넘었다."
                        exit 1
                    fi

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   browser: chromium
                        e2e: e2e
                    -   browser: firefox
                        e2e: e2e:firefox
        name: e2e (${{ matrix.browser }})
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   uses: ./.github/actions/setup

            -   name: Install browser
                timeout-minutes: 3
                run: bunx playwright install --with-deps ${{ matrix.browser }}

            # e2e 스크립트가 먼저 빌드한다.
            -   name: E2E tests
                run: bun run ${{ matrix.e2e }}

            -   name: Upload E2E report
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: playwright-report-${{ matrix.browser }}
                    path: |
                        playwright-report
                        test-results
                    retention-days: 7
