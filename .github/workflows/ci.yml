name: CI

on:
    pull_request:
    # PR 없이 develop에 바로 올린 커밋도 같은 검사를 돈다
    push:
        branches:
            - develop

# 포크에서 온 PR도 돌므로 읽기 권한만 준다
permissions:
    contents: read

# 같은 PR(브랜치)에 새로 푸시하면 이전 실행은 멈춘다
concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

# 세 작업은 동시에 돈다. E2E는 브라우저마다 그 브라우저용 빌드만 만들고 그 브라우저만 받는다
jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   uses: oven-sh/setup-bun@v2

            -   name: Install Dependencies
                run: bun ci

            -   name: Type check
                run: bun run compile

            -   name: Unit tests
                run: bun run test

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            # 한 브라우저가 실패해도 다른 브라우저는 끝까지 돈다. 한쪽에서만 깨진 것을 같은 실행에서 함께 본다
            fail-fast: false
            matrix:
                include:
                    -   browser: chromium
                        build: build
                        e2e: e2e
                    -   browser: firefox
                        build: build:firefox
                        e2e: e2e:firefox
        name: e2e (${{ matrix.browser }})
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   uses: oven-sh/setup-bun@v2

            -   name: Install Dependencies
                run: bun ci

            # E2E가 .output/chrome-mv3·firefox-mv2를 브라우저에 올린다 (e2e/fixtures.ts)
            -   name: Build
                run: bun run ${{ matrix.build }}

            -   name: Install browser
                run: bunx playwright install --with-deps ${{ matrix.browser }}

            -   name: E2E tests
                run: bun run ${{ matrix.e2e }}

            -   name: Upload E2E report
                if: failure()
                uses: actions/upload-artifact@v4
                with:
                    name: playwright-report-${{ matrix.browser }}
                    path: |
                        playwright-report
                        test-results
