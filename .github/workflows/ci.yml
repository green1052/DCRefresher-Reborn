name: CI

on:
    pull_request:
    # PR 없이 develop에 바로 올린 커밋도 같은 검사를 돈다
    push:
        branches:
            - develop

# 포크에서 온 PR도 돌므로 읽기 권한만 준다
permissions:
    contents: read

# 같은 PR(브랜치)에 새로 푸시하면 이전 실행은 멈춘다
concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   uses: oven-sh/setup-bun@v2

            -   name: Install Dependencies
                run: bun ci

            -   name: Type check
                run: bun run compile

            -   name: Unit tests
                run: bun run test

            # E2E가 .output/chrome-mv3·firefox-mv2를 브라우저에 올린다 (e2e/fixtures.ts)
            -   name: Build
                run: bun run build && bun run build:firefox

            -   name: Install browsers
                run: bunx playwright install --with-deps chromium firefox

            -   name: E2E tests (Chromium)
                id: chromium
                run: bun run e2e

            # 크로미엄 E2E가 실패해도 돈다. 파이어폭스에서만 깨진 것을 같은 실행에서 함께 본다
            -   name: E2E tests (Firefox)
                if: success() || steps.chromium.outcome == 'failure'
                run: bun run e2e:firefox

            -   name: Upload E2E report
                if: failure()
                uses: actions/upload-artifact@v4
                with:
                    name: playwright-report
                    path: |
                        playwright-report
                        test-results
